[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msfusion"
version = "0.1.0"
description = "Multimodal X-ray / neutron clast segmentation: a comparison of fusion strategies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "monai>=1.3",
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.scripts]
msfusion = "msfusion.cli:main"

[tool.setuptools.packages.find]
include = ["msfusion*"]
